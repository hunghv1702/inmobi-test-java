debug: false

spring:
  application:
    name: inmobi-test-java
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:guess_game;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.xml
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  auth:
    otp-bypass-enabled: ${OTP_BYPASS_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  payment:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
      api-base-url: ${STRIPE_API_BASE_URL:https://api.stripe.com}
      success-url: ${PAYMENT_SUCCESS_URL:http://localhost:5173/payment/success?session_id={CHECKOUT_SESSION_ID}}
      cancel-url: ${PAYMENT_CANCEL_URL:http://localhost:5173/payment/cancel}
      currency: ${PAYMENT_CURRENCY:usd}
      turn-package-amount: ${PAYMENT_TURN_PACKAGE_AMOUNT:199}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5440/inmobi_test_java}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
